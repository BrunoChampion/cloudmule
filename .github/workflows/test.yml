name: test

# Runs the test suite on Linux and macOS (bash 3.2, BSD tools). No secrets and no Hetzner token: the suite fakes
# the Hetzner CLI and never creates anything.
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Tool versions
        run: bash --version | head -1; python3 --version; ssh -V
      - name: Test suite
        run: bash tests/run.sh
