name: gpu-image

# Builds images/gpu-graphics/Dockerfile (cloudmule's prebuilt image for graphics GPU pods, docs/specs/0005 step b) and
# pushes it to GitHub Container Registry. On demand only (Actions -> gpu-image -> Run workflow): rebuild when Chrome
# needs updating or a module changes. The image holds no secrets.
# Order when modules change (tests/run.sh checks the recorded hash): push the branch, run this workflow on it, make
# sure the package is public (GitHub -> Packages -> cloudmule-gpu-graphics -> Package settings; RunPod pulls without
# credentials), copy the two lines of the job summary into bin/lib.sh, run tests/run.sh, commit.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag, e.g. the date (2026-11-19). cloudmule always uses the digest, never the tag."
        required: true

permissions:
  contents: read
  packages: write

concurrency:
  group: gpu-image
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683   # v4.2.2
        with:
          persist-credentials: false
      - name: Image name and source hash
        id: meta
        env:
          TAG: ${{ inputs.tag }}
        run: |
          [[ "$TAG" =~ ^[A-Za-z0-9][A-Za-z0-9._-]{0,127}$ ]] || { echo "invalid tag: $TAG" >&2; exit 1; }
          echo "image=ghcr.io/$(echo "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')/cloudmule-gpu-graphics" >> "$GITHUB_OUTPUT"
          echo "source=$(python3 -I images/gpu-graphics/modules-hash.py)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435   # v3.11.1
      - uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772   # v3.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83   # v6.18.0
        id: build
        with:
          context: .
          file: images/gpu-graphics/Dockerfile
          push: true
          provenance: false   # one plain linux/amd64 manifest: the digest RunPod pulls
          sbom: false
          tags: ${{ steps.meta.outputs.image }}:${{ inputs.tag }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.description=cloudmule's prebuilt image for graphics GPU pods (Chrome, GL/EGL, Node, ffmpeg)
            cloudmule.source-hash=${{ steps.meta.outputs.source }}
      - name: Lines for bin/lib.sh
        env:
          IMAGE: ${{ steps.meta.outputs.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
          SOURCE: ${{ steps.meta.outputs.source }}
        run: |
          [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "no image digest from the build (got '$DIGEST')" >&2; exit 1; }
          {
            echo '```sh'
            echo "RUNPOD_IMAGE_GRAPHICS_DEFAULT=\"$IMAGE@$DIGEST\""
            echo "RUNPOD_IMAGE_GRAPHICS_SOURCE=$SOURCE"
            echo '```'
            echo "Before using it: the package must be public (an anonymous pull must work)."
          } >> "$GITHUB_STEP_SUMMARY"
